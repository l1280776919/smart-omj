[package]
name = "smart-omj"
version = "0.1.0"
description = "Native Onmyoji automation desktop application"
license = "GPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "smart_omj_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libloading = "0.8"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "rt-multi-thread", "macros", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
opencv = { version = "0.101.1", default-features = false, features = ["imgproc", "clang-runtime"] }
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "api-31", "cuda", "preload-dylibs"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Avoid recurring MSVC LNK2001/LNK2019 errors for anonymous LLVM symbols
# when reusing incremental objects for the optimized application crate.
# Keep this in the profile so normal Tauri dev and cargo test builds both inherit it.
[profile.dev]
incremental = false

# Keep image preprocessing inside the 1.5-second click freshness budget in desktop development.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.smart-omj]
opt-level = 1
